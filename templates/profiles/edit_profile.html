<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - SheSkills</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff5f7, #fce4ec);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .navbar {
            max-width: 1000px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: #c2185b;
            font-size: 28px;
            font-weight: 700;
        }

        .back-link {
            text-decoration: none;
            color: #ad1457;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #880e4f;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-heading h2 {
            font-size: 30px;
            color: #880e4f;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777;
            font-size: 14px;
        }

        .form-card {
            background: #fff;
            max-width: 650px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(136, 14, 79, 0.10);
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #444;
        }

        input:not([type="checkbox"]):not([type="radio"]),
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0cbd4;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d81b60;
            box-shadow: 0 0 0 3px rgba(216, 27, 96, 0.10);
        }

        input[type="file"] {
            padding: 10px;
            background: #fff8fa;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 7px;
            accent-color: #c2185b;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        ul.errorlist {
            color: #c62828;
            font-size: 13px;
            margin: 5px 0 10px 18px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            text-align: center;
            padding: 12px 22px;
            border: none;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #c2185b;
            color: #fff;
            flex: 1;
        }

        .btn-primary:hover {
            background: #880e4f;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #555;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #eaeaea;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .form-card {
                padding: 22px 18px;
            }

            .page-heading h2 {
                font-size: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            .navbar .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🌸 SheSkills</div>

        <a href="{% url 'my_profile' %}" class="back-link">
            ← Back to My Profile
        </a>
    </nav>

    <div class="page-heading">
        <h2>Edit My Profile</h2>
        <p>Keep your information updated so customers can discover your skills.</p>
    </div>

    <div class="form-card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}


            <div class="button-group">
                <button type="submit" class="btn btn-primary">
                    Update Profile
                </button>

                <a href="{% url 'my_profile' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <div class="footer">
        © 2026 SheSkills | Empowering Women Through Their Skills
    </div>

</body>
</html>
